<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NBA Live Scores</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --score-column-width: 150px;
      --bg: #050505;
      --panel: #0d0d0f;
      --panel-soft: #141416;
      --border: #242428;
      --text: #f5f5f5;
      --muted: #8a8a8f;
      --red: #ff2b2b;
      --green: #22c55e;
      --gold: #f5c542;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px;
      background:
        radial-gradient(circle at top left, rgba(255, 43, 43, 0.14), transparent 36%),
        radial-gradient(circle at top right, rgba(34, 197, 94, 0.08), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      max-width: 1240px;
      margin: 0 auto;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 56px);
      font-weight: 950;
      letter-spacing: -2px;
      line-height: 0.95;
    }

    .subtitle {
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    #updated {
      color: #aaa;
      font-size: 13px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 12px;
      white-space: nowrap;
    }

    .controls {
      margin-bottom: 22px;
      padding: 16px;
      background: rgba(13, 13, 15, 0.82);
      border: 1px solid var(--border);
      border-radius: 22px;
      display: grid;
      gap: 16px;
      box-shadow:
        0 20px 60px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.04);
      backdrop-filter: blur(14px);
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .control-row label,
    .toggle-label {
      color: #c9c9ce;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--red);
    }

    select {
      background: #101012;
      color: white;
      border: 1px solid #33333a;
      border-radius: 10px;
      padding: 8px 10px;
      accent-color: var(--red);
    }

    .reddit-toggle {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      color: #ddd;
      font-size: 14px;
    }

    .reddit-toggle input {
      width: 18px;
      height: 18px;
      accent-color: var(--red);
    }

    .reddit-status {
      color: var(--muted);
      font-size: 12px;
    }

    #hiddenGames {
      margin-bottom: 18px;
      display: none;
      padding: 14px;
      background: rgba(13,13,15,0.82);
      border: 1px solid var(--border);
      border-radius: 18px;
    }

    #hiddenGames.active {
      display: block;
    }

    .hidden-title {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      font-weight: 800;
    }

    .hidden-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      font-family: inherit;
    }

    .hidden-game-button,
    .hide-game-button,
    .spoiler-toggle-button {
      background: #111114;
      color: #ddd;
      border: 1px solid #33333a;
      border-radius: 999px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 750;
      transition: 0.15s ease;
    }

    .hidden-game-button:hover,
    .hide-game-button:hover,
    .spoiler-toggle-button:hover {
      border-color: var(--red);
      color: white;
      transform: translateY(-1px);
    }

    #scores {
      display: grid;
      gap: 18px;
    }

    .game {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px;
      gap: 20px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.035), transparent 20%),
        var(--panel);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 24px;
      box-shadow:
        0 22px 70px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.04);
      overflow: hidden;
    }

    .game::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 28px;
      pointer-events: none;
      background: linear-gradient(90deg, rgba(255,43,43,0.16), transparent 28%);
      opacity: 0.55;
    }

    .game.hidden {
      display: none;
    }

    .main-side,
    .reddit-side {
      position: relative;
      z-index: 1;
    }

    .card-actions {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 3;
      display: flex;
      gap: 8px;
    }

    .game.spoiler-hidden .score {
      color: transparent !important;
      text-shadow: none !important;
      background: #1b1b1f;
      border-radius: 12px;
      min-width: 58px;
    }

    .game.spoiler-hidden .score.flash {
      animation: none !important;
    }

    .game.spoiler-hidden .score::after {
      content: "••";
      color: #6f6f76;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: var(--score-column-width) 1fr;
      gap: 30px;
      align-items: center;
      padding-right: 190px;
      margin-bottom: 18px;
    }

    .scores-left {
      display: grid;
      gap: 14px;
      justify-items: start;
    }

    .score-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .score-label {
      width: 44px;
      color: #999;
      font-size: 13px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .score {
      font-size: 50px;
      line-height: 0.95;
      font-weight: 950;
      color: white;
      display: inline-block;
      transform-origin: center;
      min-width: 54px;
      font-variant-numeric: tabular-nums;
    }

    .score.flash {
      animation: flashScore 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @keyframes flashScore {
      0% {
        transform: scale(1);
        color: white;
        text-shadow: none;
      }

      20% {
        transform: scale(1.9);
        color: var(--red);
        text-shadow:
          0 0 12px rgba(255, 0, 0, 0.95),
          0 0 28px rgba(255, 0, 0, 0.9),
          0 0 48px rgba(255, 0, 0, 0.8);
      }

      60% {
        transform: scale(1.45);
        color: #ff4d4d;
        text-shadow:
          0 0 10px rgba(255, 0, 0, 0.8),
          0 0 24px rgba(255, 0, 0, 0.7);
      }

      100% {
        transform: scale(1);
        color: white;
        text-shadow: none;
      }
    }

    .teams-right {
      display: grid;
      gap: 22px;
      min-width: 0;
    }

    .team-name {
      font-size: 24px;
      font-weight: 850;
      letter-spacing: -0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status {
      display: inline-flex;
      width: fit-content;
      margin-top: 4px;
      padding: 8px 11px;
      border: 1px solid #25252a;
      border-radius: 999px;
      color: #aaa;
      background: #101012;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .live {
      color: var(--green);
      border-color: rgba(34,197,94,0.35);
      background: rgba(34,197,94,0.08);
    }

    .broadcast,
    .plays,
    .reddit-panel {
      margin-top: 14px;
      color: #c8c8ce;
      font-size: 14px;
      line-height: 1.6;
    }

    .label {
      color: #777;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 950;
      letter-spacing: 1.1px;
      margin-right: 6px;
    }

    .plays {
      background: rgba(255,255,255,0.025);
      border: 1px solid #1f1f24;
      border-radius: 18px;
      padding: 14px;
    }

    .play {
      padding: 10px 0;
      border-bottom: 1px solid #1b1b1f;
    }

    .play:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .play-time {
      display: inline-block;
      color: var(--gold);
      font-weight: 950;
      margin-right: 8px;
      font-size: 12px;
    }

    .score-change {
      color: var(--green);
      font-weight: 900;
      margin-left: 6px;
    }

    .reddit-side {
      border-left: 1px solid #242428;
      padding-left: 20px;
      min-width: 0;
    }

    .reddit-panel {
      background: rgba(255,255,255,0.025);
      border: 1px solid #1f1f24;
      border-radius: 20px;
      padding: 16px;
      margin-top: 0;
    }

    .reddit-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .reddit-title {
      color: #fff;
      font-size: 14px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .reddit-thread-link {
      display: inline-block;
      margin: 6px 0 10px;
      color: #ff7777;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
    }

    .reddit-thread-link:hover {
      text-decoration: underline;
    }

    .comment {
      padding: 11px 0;
      border-bottom: 1px solid #1b1b1f;
    }

    .comment:last-child {
      border-bottom: none;
    }

    .comment-meta {
      color: #818188;
      font-size: 12px;
      margin-bottom: 5px;
      font-weight: 750;
    }

    .comment-body {
      color: #ddd;
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .postgame {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid #29292e;
    }

    @media (max-width: 950px) {
      body {
        padding: 20px;
      }

      .hero {
        align-items: flex-start;
        flex-direction: column;
      }

      .game {
        grid-template-columns: 1fr;
      }

      .reddit-side {
        border-left: none;
        border-top: 1px solid #242428;
        padding-left: 0;
        padding-top: 18px;
      }

      .scoreboard {
        padding-right: 0;
      }

      .card-actions {
        position: static;
        margin-bottom: 14px;
      }

      .team-name {
        white-space: normal;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="hero">
      <div>
        <h1>NBA LIVE SCORES</h1>
        <div class="subtitle">
          Live scoreboard, latest plays, broadcasts, and Reddit threads.
        </div>
      </div>

      <div id="updated">Loading...</div>
    </div>

    <div class="controls">
      <div class="control-row">
        <label for="scoreSpacing">Score spacing</label>

        <input
          id="scoreSpacing"
          type="range"
          min="110"
          max="260"
          value="150"
        />
      </div>

      <div class="reddit-toggle">
        <input
          type="checkbox"
          id="pauseRedditRefresh"
        />

        <label class="toggle-label" for="pauseRedditRefresh">
          Pause Reddit Refresh
        </label>

        <span class="reddit-status" id="redditStatus">
          Reddit auto-refresh active
        </span>
      </div>
    </div>

    <div id="hiddenGames">
      <div class="hidden-title">
        Hidden games — click to unhide
      </div>

      <div
        class="hidden-list"
        id="hiddenGamesList"
      ></div>
    </div>

    <div id="scores"></div>
  </div>

  <script>
    const scoresEl = document.getElementById("scores");
    const updatedEl = document.getElementById("updated");
    const scoreSpacingEl = document.getElementById("scoreSpacing");
    const pauseRedditRefreshEl = document.getElementById("pauseRedditRefresh");
    const redditStatusEl = document.getElementById("redditStatus");
    const hiddenGamesEl = document.getElementById("hiddenGames");
    const hiddenGamesListEl = document.getElementById("hiddenGamesList");

    const previousScores = {};
    const gameCards = {};
    const redditState = {};
    const gameLabels = {};

    const hiddenGames =
      new Set(
        JSON.parse(
          localStorage.getItem("hiddenNbaGames") || "[]"
        )
      );

    let redditRefreshPaused = false;

    pauseRedditRefreshEl.addEventListener("change", () => {
      redditRefreshPaused = pauseRedditRefreshEl.checked;

      redditStatusEl.textContent =
        redditRefreshPaused
          ? "Reddit auto-refresh paused"
          : "Reddit auto-refresh active";
    });

    scoreSpacingEl.addEventListener("input", () => {
      document.documentElement.style.setProperty(
        "--score-column-width",
        `${scoreSpacingEl.value}px`
      );
    });

    function saveHiddenGames() {
      localStorage.setItem(
        "hiddenNbaGames",
        JSON.stringify([...hiddenGames])
      );
    }

    function updateHiddenGamesUI() {
      hiddenGamesListEl.innerHTML = "";

      if (hiddenGames.size === 0) {
        hiddenGamesEl.classList.remove("active");
        return;
      }

      hiddenGamesEl.classList.add("active");

      [...hiddenGames].forEach(gameId => {
        const button = document.createElement("button");

        button.className = "hidden-game-button";
        button.textContent = gameLabels[gameId] || `Game ${gameId}`;

        button.addEventListener("click", () => {
          unhideGame(gameId);
        });

        hiddenGamesListEl.appendChild(button);
      });
    }

    function hideGame(gameId) {
      hiddenGames.add(gameId);
      saveHiddenGames();

      if (gameCards[gameId]) {
        gameCards[gameId].classList.add("hidden");
      }

      updateHiddenGamesUI();
    }

    function unhideGame(gameId) {
      hiddenGames.delete(gameId);
      saveHiddenGames();

      if (gameCards[gameId]) {
        gameCards[gameId].classList.remove("hidden");
      }

      updateHiddenGamesUI();
    }

    function flash(el) {
      el.classList.remove("flash");
      void el.offsetWidth;
      el.classList.add("flash");
    }

    function escapeHTML(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function createGameCard(gameId) {
      const card = document.createElement("div");

      card.className = "game";
      card.id = `game-${gameId}`;

      card.innerHTML = `
        <div class="card-actions">
          <button
            class="spoiler-toggle-button"
            type="button"
          >
            Hide scores
          </button>

          <button
            class="hide-game-button"
            type="button"
          >
            Hide game
          </button>
        </div>

        <div class="main-side">
          <div class="scoreboard">
            <div class="scores-left">
              <div class="score-row">
                <div class="score-label away-abbr"></div>
                <div class="score away-score">0</div>
              </div>

              <div class="score-row">
                <div class="score-label home-abbr"></div>
                <div class="score home-score">0</div>
              </div>
            </div>

            <div class="teams-right">
              <div class="team-name away-name"></div>
              <div class="team-name home-name"></div>
            </div>
          </div>

          <div class="status"></div>

          <div class="broadcast">
            <span class="label">Broadcast</span>
            <span class="broadcast-text">TBD</span>
          </div>

          <div class="plays">
            <span class="label">Latest Plays</span>
            <div class="plays-list"></div>
          </div>
        </div>

        <div class="reddit-side">
          <div class="reddit-panel">
            <div class="reddit-header">
              <div class="reddit-title">Game Thread</div>

              <select class="reddit-sort">
                <option value="new">Newest</option>
                <option value="top">Most upvoted</option>
              </select>
            </div>

            <div class="reddit-game-thread">
              Looking for Reddit game thread...
            </div>

            <div class="postgame">
              <div class="reddit-title">Postgame Thread</div>
              <div class="reddit-postgame-thread">
                Available after final.
              </div>
            </div>
          </div>
        </div>
      `;

      card
        .querySelector(".reddit-sort")
        .addEventListener("change", () => {
          refreshRedditForGame(gameId, true);
        });

      card
        .querySelector(".hide-game-button")
        .addEventListener("click", event => {
          event.stopPropagation();
          hideGame(gameId);
        });

      const spoilerButton =
        card.querySelector(".spoiler-toggle-button");

      spoilerButton.addEventListener("click", event => {
        event.stopPropagation();

        const hidden =
          card.classList.toggle("spoiler-hidden");

        spoilerButton.textContent =
          hidden
            ? "Show scores"
            : "Hide scores";
      });

      if (hiddenGames.has(gameId)) {
        card.classList.add("hidden");
      }

      scoresEl.appendChild(card);
      gameCards[gameId] = card;

      return card;
    }

    function getPlayTimestamp(play) {
      const period =
        play.period?.number ||
        play.period ||
        "";

      const clock =
        play.clock?.displayValue ||
        play.displayClock ||
        play.clock ||
        "";

      if (period && clock) {
        return `Q${period} ${clock}`;
      }

      if (clock) {
        return clock;
      }

      return "Time unavailable";
    }

    async function getLatestPlays(
      gameId,
      awayAbbr,
      homeAbbr
    ) {
      try {
        const res =
          await fetch(
            `https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=${gameId}`
          );

        const data = await res.json();

        const latestThree =
          (data?.plays || [])
            .slice(-3)
            .reverse();

        if (!latestThree.length) {
          return `
            <div class="play">
              No recent plays available
            </div>
          `;
        }

        return latestThree.map(play => {
          const hasScore =
            play.awayScore !== undefined &&
            play.homeScore !== undefined;

          const scoreText =
            hasScore
              ? `
                <span class="score-change">
                  (${awayAbbr} ${play.awayScore}
                  - ${homeAbbr} ${play.homeScore})
                </span>
              `
              : "";

          const timestamp =
            getPlayTimestamp(play);

          return `
            <div class="play">
              <span class="play-time">
                ${timestamp}
              </span>

              ${escapeHTML(
                play.text ||
                "Play unavailable"
              )}

              ${scoreText}
            </div>
          `;
        }).join("");

      } catch (err) {
        console.error("Play-by-play fetch failed", err);

        return `
          <div class="play">
            Play-by-play unavailable
          </div>
        `;
      }
    }

    function redditSearchUrl(query) {
      return (
        "https://www.reddit.com/r/nba/search.json" +
        `?q=${encodeURIComponent(query)}` +
        "&restrict_sr=1" +
        "&sort=new" +
        "&limit=10"
      );
    }

    function redditCommentsUrl(permalink, sort) {
      return (
        `https://www.reddit.com${permalink}.json` +
        `?sort=${encodeURIComponent(sort)}` +
        "&limit=8"
      );
    }

    function buildThreadQueries(
      awayName,
      homeName,
      awayAbbr,
      homeAbbr,
      type
    ) {
      const label =
        type === "postgame"
          ? "Post Game Thread"
          : "Game Thread";

      return [
        `${label} ${awayName} ${homeName}`,
        `${label} ${awayAbbr} ${homeAbbr}`,
        `${label} ${homeName} ${awayName}`,
        `${label} ${homeAbbr} ${awayAbbr}`
      ];
    }

    async function findRedditThread(
      awayName,
      homeName,
      awayAbbr,
      homeAbbr,
      type
    ) {
      const queries =
        buildThreadQueries(
          awayName,
          homeName,
          awayAbbr,
          homeAbbr,
          type
        );

      for (const query of queries) {
        try {
          const res =
            await fetch(
              redditSearchUrl(query)
            );

          const data =
            await res.json();

          const posts =
            data?.data?.children?.map(
              x => x.data
            ) || [];

          const match =
            posts.find(post => {
              const title =
                (
                  post.title || ""
                ).toLowerCase();

              const wantsPostgame =
                type === "postgame";

              const hasCorrectType =
                wantsPostgame
                  ? (
                      title.includes("post game thread") ||
                      title.includes("post-game thread") ||
                      title.includes("postgame thread")
                    )
                  : (
                      title.includes("game thread") &&
                      !title.includes("post game") &&
                      !title.includes("post-game") &&
                      !title.includes("postgame")
                    );

              const hasTeams =
                (
                  title.includes(awayName.toLowerCase()) ||
                  title.includes(awayAbbr.toLowerCase())
                ) &&
                (
                  title.includes(homeName.toLowerCase()) ||
                  title.includes(homeAbbr.toLowerCase())
                );

              return hasCorrectType && hasTeams;
            });

          if (match) {
            return match;
          }

        } catch (err) {
          console.error("Reddit search failed", err);
        }
      }

      return null;
    }

    async function getRedditComments(permalink, sort) {
      const res =
        await fetch(
          redditCommentsUrl(
            permalink,
            sort
          )
        );

      const data =
        await res.json();

      const comments =
        data?.[1]?.data?.children
          ?.filter(
            item => item.kind === "t1"
          )
          ?.map(
            item => item.data
          )
          ?.filter(
            comment =>
              comment.body &&
              comment.body !== "[deleted]"
          )
          ?.slice(0, 6) || [];

      return comments;
    }

    function renderRedditThread(
      targetEl,
      thread,
      comments,
      fallbackText
    ) {
      if (!thread) {
        targetEl.innerHTML =
          escapeHTML(fallbackText);
        return;
      }

      const commentsHTML =
        comments.length
          ? comments.map(comment => {
              return `
                <div class="comment">
                  <div class="comment-meta">
                    u/${escapeHTML(comment.author)}
                    • ${comment.score} upvotes
                  </div>

                  <div class="comment-body">
                    ${escapeHTML(comment.body)}
                  </div>
                </div>
              `;
            }).join("")
          : `
            <div class="comment">
              No comments found yet.
            </div>
          `;

      targetEl.innerHTML = `
        <a
          class="reddit-thread-link"
          href="https://www.reddit.com${thread.permalink}"
          target="_blank"
          rel="noopener noreferrer"
        >
          ${escapeHTML(thread.title)}
        </a>

        ${commentsHTML}
      `;
    }

    async function refreshRedditForGame(
      gameId,
      force = false
    ) {
      if (
        redditRefreshPaused &&
        !force
      ) {
        return;
      }

      const state =
        redditState[gameId];

      if (!state) return;

      const now =
        Date.now();

      if (
        !force &&
        state.lastRefresh &&
        now - state.lastRefresh < 30000
      ) {
        return;
      }

      state.lastRefresh = now;

      const card =
        gameCards[gameId];

      const sort =
        card.querySelector(
          ".reddit-sort"
        ).value;

      const gameThreadEl =
        card.querySelector(
          ".reddit-game-thread"
        );

      const postgameThreadEl =
        card.querySelector(
          ".reddit-postgame-thread"
        );

      try {
        if (!state.gameThread) {
          state.gameThread =
            await findRedditThread(
              state.awayName,
              state.homeName,
              state.awayAbbr,
              state.homeAbbr,
              "game"
            );
        }

        if (state.gameThread) {
          const comments =
            await getRedditComments(
              state.gameThread.permalink,
              sort
            );

          renderRedditThread(
            gameThreadEl,
            state.gameThread,
            comments,
            "No game thread found yet."
          );
        } else {
          renderRedditThread(
            gameThreadEl,
            null,
            [],
            "No game thread found yet."
          );
        }

        if (state.isFinal) {
          if (
            !state.postgameThread &&
            !state.postgameStopped
          ) {
            state.postgameThread =
              await findRedditThread(
                state.awayName,
                state.homeName,
                state.awayAbbr,
                state.homeAbbr,
                "postgame"
              );
          }

          if (state.postgameThread) {
            const postgameComments =
              await getRedditComments(
                state.postgameThread.permalink,
                sort
              );

            renderRedditThread(
              postgameThreadEl,
              state.postgameThread,
              postgameComments,
              "No postgame thread found yet."
            );
          } else {
            renderRedditThread(
              postgameThreadEl,
              null,
              [],
              state.postgameStopped
                ? "No postgame thread found after final checks."
                : "Postgame thread not found yet."
            );
          }
        } else {
          postgameThreadEl.innerHTML =
            "Available after final.";
        }

      } catch (err) {
        console.error(
          "Reddit refresh failed",
          err
        );

        gameThreadEl.innerHTML =
          "Could not load Reddit comments. Reddit may be blocking browser requests.";
      }
    }

    function schedulePostgameChecks(gameId) {
      const state =
        redditState[gameId];

      if (
        !state ||
        state.postgameChecksScheduled
      ) {
        return;
      }

      state.postgameChecksScheduled =
        true;

      setTimeout(async () => {
        await refreshRedditForGame(
          gameId,
          true
        );

        if (!state.postgameThread) {
          setTimeout(async () => {
            await refreshRedditForGame(
              gameId,
              true
            );

            if (!state.postgameThread) {
              state.postgameStopped =
                true;

              await refreshRedditForGame(
                gameId,
                true
              );
            }
          }, 60 * 60 * 1000);
        }
      }, 10 * 60 * 1000);
    }

    async function loadScores() {
      try {
        const res =
          await fetch(
            "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard"
          );

        const data =
          await res.json();

        if (
          !data.events ||
          data.events.length === 0
        ) {
          scoresEl.innerHTML =
            "<p>No NBA games today.</p>";

          return;
        }

        for (const event of data.events) {
          const comp =
            event.competitions[0];

          const teams =
            comp.competitors;

          const away =
            teams.find(
              t =>
                t.homeAway === "away"
            );

          const home =
            teams.find(
              t =>
                t.homeAway === "home"
            );

          const gameId =
            event.id;

          const card =
            gameCards[gameId] ||
            createGameCard(gameId);

          const gameLabel =
            `${away.team.abbreviation} vs ${home.team.abbreviation}`;

          gameLabels[gameId] =
            gameLabel;

          const awayScore =
            parseInt(
              away.score || 0
            );

          const homeScore =
            parseInt(
              home.score || 0
            );

          const prevAway =
            previousScores[
              gameId
            ]?.away ??
            awayScore;

          const prevHome =
            previousScores[
              gameId
            ]?.home ??
            homeScore;

          const awayChanged =
            awayScore !==
            prevAway;

          const homeChanged =
            homeScore !==
            prevHome;

          previousScores[
            gameId
          ] = {
            away: awayScore,
            home: homeScore
          };

          card.querySelector(
            ".away-abbr"
          ).textContent =
            away.team.abbreviation;

          card.querySelector(
            ".home-abbr"
          ).textContent =
            home.team.abbreviation;

          card.querySelector(
            ".away-name"
          ).textContent =
            away.team.displayName;

          card.querySelector(
            ".home-name"
          ).textContent =
            home.team.displayName;

          const awayScoreEl =
            card.querySelector(
              ".away-score"
            );

          const homeScoreEl =
            card.querySelector(
              ".home-score"
            );

          if (
            awayScoreEl.textContent !==
            String(awayScore)
          ) {
            awayScoreEl.textContent =
              awayScore;

            if (awayChanged) {
              flash(
                awayScoreEl
              );
            }
          }

          if (
            homeScoreEl.textContent !==
            String(homeScore)
          ) {
            homeScoreEl.textContent =
              homeScore;

            if (homeChanged) {
              flash(
                homeScoreEl
              );
            }
          }

          const statusEl =
            card.querySelector(
              ".status"
            );

          const state =
            event.status.type.state;

          statusEl.textContent =
            event.status.type.shortDetail;

          statusEl.className =
            "status" +
            (
              state === "in"
                ? " live"
                : ""
            );

          const broadcasts =
            comp.broadcasts &&
            comp.broadcasts.length
              ? comp.broadcasts
                  .map(
                    b =>
                      b.names
                        ? b.names.join(", ")
                        : b.name
                  )
                  .filter(
                    Boolean
                  )
                  .join(", ")
              : "TBD";

          card.querySelector(
            ".broadcast-text"
          ).textContent =
            broadcasts;

          const playsHTML =
            await getLatestPlays(
              gameId,
              away.team.abbreviation,
              home.team.abbreviation
            );

          const playsList =
            card.querySelector(
              ".plays-list"
            );

          if (
            playsList.innerHTML !==
            playsHTML
          ) {
            playsList.innerHTML =
              playsHTML;
          }

          if (!redditState[gameId]) {
            redditState[gameId] = {
              awayName:
                away.team.displayName,

              homeName:
                home.team.displayName,

              awayAbbr:
                away.team.abbreviation,

              homeAbbr:
                home.team.abbreviation,

              gameThread:
                null,

              postgameThread:
                null,

              isFinal:
                false,

              postgameChecksScheduled:
                false,

              postgameStopped:
                false,

              lastRefresh:
                0
            };
          }

          redditState[gameId].isFinal =
            state === "post";

          await refreshRedditForGame(
            gameId
          );

          if (state === "post") {
            schedulePostgameChecks(
              gameId
            );
          }
        }

        updateHiddenGamesUI();

        updatedEl.textContent =
          "Updated " +
          new Date()
            .toLocaleTimeString();

      } catch (err) {
        console.error(err);

        scoresEl.innerHTML =
          "<p>Failed to load scores.</p>";
      }
    }

    loadScores();

    setInterval(
      loadScores,
      1000
    );
  </script>
