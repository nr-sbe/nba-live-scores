<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NBA Live Scores</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --score-column-width: 150px;
    }

    body {
      margin: 0;
      padding: 32px;
      background: #000;
      color: #f5f5f5;
      font-family: Inter, system-ui, sans-serif;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    #updated {
      color: #666;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .controls {
      max-width: 1200px;
      margin-bottom: 24px;
      padding: 16px;
      background: #080808;
      border: 1px solid #181818;
      border-radius: 16px;
      display: grid;
      gap: 18px;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .control-row label {
      color: #aaa;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    input[type="range"],
    select {
      accent-color: #ff2b2b;
    }

    input[type="range"] {
      width: 100%;
    }

    select {
      background: #111;
      color: white;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 8px;
    }

    .reddit-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #ddd;
      font-size: 14px;
    }

    .reddit-toggle input {
      width: 18px;
      height: 18px;
      accent-color: #ff2b2b;
    }

    .reddit-status {
      color: #777;
      font-size: 12px;
    }

    #hiddenGames {
      max-width: 1200px;
      margin-bottom: 16px;
      display: none;
      padding: 14px;
      background: #080808;
      border: 1px solid #181818;
      border-radius: 16px;
    }

    #hiddenGames.active {
      display: block;
    }

    .hidden-title {
      color: #777;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .hidden-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .hidden-game-button,
    .hide-game-button,
    .spoiler-toggle-button {
      background: #111;
      color: #ddd;
      border: 1px solid #333;
      border-radius: 999px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 12px;
    }

    .hidden-game-button:hover,
    .hide-game-button:hover,
    .spoiler-toggle-button:hover {
      border-color: #ff2b2b;
      color: white;
    }

    #scores {
      display: grid;
      gap: 16px;
      max-width: 1200px;
    }

    .game {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px;
      gap: 18px;
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      border-radius: 20px;
      padding: 22px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.02),
        0 10px 30px rgba(0,0,0,0.5);
    }

    .game.hidden {
      display: none;
    }

    .hide-game-button {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 2;
    }

    .spoiler-toggle-button {
      position: absolute;
      top: 12px;
      right: 110px;
      z-index: 2;
    }

    .game.spoiler-hidden .score {
      color: transparent !important;
      text-shadow: none !important;
      background: #1b1b1b;
      border-radius: 8px;
      min-width: 52px;
    }

    .game.spoiler-hidden .score.flash {
      animation: none !important;
    }

    .game.spoiler-hidden .score::after {
      content: "••";
      color: #666;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: var(--score-column-width) 1fr;
      gap: 28px;
      align-items: center;
      padding-right: 180px;
    }

    .scores-left {
      display: grid;
      gap: 12px;
      justify-items: start;
    }

    .score-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .score-label {
      width: 42px;
      color: #777;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .score {
      font-size: 46px;
      font-weight: 900;
      color: white;
      display: inline-block;
      transform-origin: center;
      min-width: 48px;
    }

    .score.flash {
      animation: flashScore 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @keyframes flashScore {
      0% {
        transform: scale(1);
        color: white;
        text-shadow: none;
      }

      20% {
        transform: scale(1.9);
        color: #ff2b2b;
        text-shadow:
          0 0 12px rgba(255, 0, 0, 0.95),
          0 0 28px rgba(255, 0, 0, 0.9),
          0 0 48px rgba(255, 0, 0, 0.8);
      }

      60% {
        transform: scale(1.45);
        color: #ff4d4d;
        text-shadow:
          0 0 10px rgba(255, 0, 0, 0.8),
          0 0 24px rgba(255, 0, 0, 0.7);
      }

      100% {
        transform: scale(1);
        color: white;
        text-shadow: none;
      }
    }

    .teams-right {
      display: grid;
      gap: 18px;
      min-width: 0;
    }

    .team-name {
      font-size: 22px;
      font-weight: 600;
    }

    .status {
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px solid #161616;
      color: #999;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .live {
      color: #22c55e;
      font-weight: 700;
    }

    .broadcast,
    .plays,
    .reddit-panel {
      margin-top: 12px;
      color: #bdbdbd;
      font-size: 14px;
      line-height: 1.6;
    }

    .label {
      color: #666;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 1px;
      margin-right: 6px;
    }

    .play {
      padding: 8px 0;
      border-bottom: 1px solid #111;
    }

    .play:last-child {
      border-bottom: none;
    }

    .play-time {
      color: #888;
      font-weight: 800;
      margin-right: 8px;
      font-size: 12px;
    }

    .score-change {
      color: #22c55e;
      font-weight: 800;
      margin-left: 6px;
    }

    .reddit-side {
      border-left: 1px solid #181818;
      padding-left: 18px;
      min-width: 0;
    }

    .reddit-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .reddit-title {
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .reddit-thread-link {
      display: inline-block;
      margin: 6px 0 10px;
      color: #ff6b6b;
      font-size: 13px;
      text-decoration: none;
    }

    .reddit-thread-link:hover {
      text-decoration: underline;
    }

    .comment {
      padding: 10px 0;
      border-bottom: 1px solid #151515;
    }

    .comment:last-child {
      border-bottom: none;
    }

    .comment-meta {
      color: #777;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .comment-body {
      color: #ddd;
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .postgame {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #222;
    }

    @media (max-width: 950px) {
      .game {
        grid-template-columns: 1fr;
      }

      .reddit-side {
        border-left: none;
        border-top: 1px solid #181818;
        padding-left: 0;
        padding-top: 18px;
      }

      .scoreboard {
        padding-right: 0;
      }

      .hide-game-button,
      .spoiler-toggle-button {
        position: static;
        width: fit-content;
        margin-bottom: 12px;
      }
    }
  </style>
</head>

<body>

  <h1>NBA LIVE SCORES</h1>

  <div id="updated">Loading...</div>

  <div class="controls">

    <div class="control-row">
      <label for="scoreSpacing">Score spacing</label>

      <input
        id="scoreSpacing"
        type="range"
        min="110"
        max="260"
        value="150"
      />
    </div>

    <div class="reddit-toggle">
      <input
        type="checkbox"
        id="pauseRedditRefresh"
      />

      <label for="pauseRedditRefresh">
        Pause Reddit Refresh
      </label>

      <span class="reddit-status" id="redditStatus">
        Reddit auto-refresh active
      </span>
    </div>

  </div>

  <div id="hiddenGames">
    <div class="hidden-title">
      Hidden games — click to unhide
    </div>

    <div
      class="hidden-list"
      id="hiddenGamesList"
    ></div>
  </div>

  <div id="scores"></div>

  <script>
    const scoresEl =
      document.getElementById("scores");

    const updatedEl =
      document.getElementById("updated");

    const scoreSpacingEl =
      document.getElementById("scoreSpacing");

    const pauseRedditRefreshEl =
      document.getElementById("pauseRedditRefresh");

    const redditStatusEl =
      document.getElementById("redditStatus");

    const hiddenGamesEl =
      document.getElementById("hiddenGames");

    const hiddenGamesListEl =
      document.getElementById("hiddenGamesList");

    const previousScores = {};
    const gameCards = {};
    const redditState = {};
    const gameLabels = {};

    const hiddenGames =
      new Set(
        JSON.parse(
          localStorage.getItem(
            "hiddenNbaGames"
          ) || "[]"
        )
      );

    let redditRefreshPaused =
      false;

    pauseRedditRefreshEl.addEventListener(
      "change",
      () => {

        redditRefreshPaused =
          pauseRedditRefreshEl.checked;

        redditStatusEl.textContent =
          redditRefreshPaused
            ? "Reddit auto-refresh paused"
            : "Reddit auto-refresh active";
      }
    );

    scoreSpacingEl.addEventListener(
      "input",
      () => {

        document.documentElement
          .style
          .setProperty(
            "--score-column-width",
            `${scoreSpacingEl.value}px`
          );
      }
    );

    function saveHiddenGames() {

      localStorage.setItem(
        "hiddenNbaGames",
        JSON.stringify(
          [...hiddenGames]
        )
      );
    }

    function updateHiddenGamesUI() {

      hiddenGamesListEl.innerHTML =
        "";

      if (
        hiddenGames.size === 0
      ) {

        hiddenGamesEl.classList.remove(
          "active"
        );

        return;
      }

      hiddenGamesEl.classList.add(
        "active"
      );

      [...hiddenGames].forEach(
        gameId => {

          const button =
            document.createElement(
              "button"
            );

          button.className =
            "hidden-game-button";

          button.textContent =
            gameLabels[gameId] ||
            `Game ${gameId}`;

          button.addEventListener(
            "click",
            () => {
              unhideGame(gameId);
            }
          );

          hiddenGamesListEl.appendChild(
            button
          );
        }
      );
    }

    function hideGame(gameId) {

      hiddenGames.add(gameId);

      saveHiddenGames();

      if (
        gameCards[gameId]
      ) {

        gameCards[gameId]
          .classList
          .add("hidden");
      }

      updateHiddenGamesUI();
    }

    function unhideGame(gameId) {

      hiddenGames.delete(gameId);

      saveHiddenGames();

      if (
        gameCards[gameId]
      ) {

        gameCards[gameId]
          .classList
          .remove("hidden");
      }

      updateHiddenGamesUI();
    }

    function flash(el) {

      el.classList.remove(
        "flash"
      );

      void el.offsetWidth;

      el.classList.add(
        "flash"
      );
    }

    function escapeHTML(value) {

      return String(value || "")
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );
    }

    function createGameCard(gameId) {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "game";

      card.id =
        `game-${gameId}`;

      card.innerHTML = `
        <button
          class="hide-game-button"
          type="button"
        >
          Hide game
        </button>

        <button
          class="spoiler-toggle-button"
          type="button"
        >
          Hide scores
        </button>

        <div class="main-side">

          <div class="scoreboard">

            <div class="scores-left">

              <div class="score-row">
                <div class="score-label away-abbr"></div>

                <div class="score away-score">
                  0
                </div>
              </div>

              <div class="score-row">
                <div class="score-label home-abbr"></div>

                <div class="score home-score">
                  0
                </div>
              </div>

            </div>

            <div class="teams-right">

              <div class="team-name away-name"></div>

              <div class="team-name home-name"></div>

            </div>

          </div>

          <div class="status"></div>

          <div class="broadcast">
            <span class="label">
              Broadcast
            </span>

            <span class="broadcast-text">
              TBD
            </span>
          </div>

          <div class="plays">
            <span class="label">
              Latest Plays
            </span>

            <div class="plays-list"></div>
          </div>

        </div>

        <div class="reddit-side">

          <div class="reddit-panel">

            <div class="reddit-header">

              <div class="reddit-title">
                Game Thread
              </div>

              <select class="reddit-sort">
                <option value="new">
                  Newest
                </option>

                <option value="top">
                  Most upvoted
                </option>
              </select>

            </div>

            <div class="reddit-game-thread">
              Looking for Reddit game thread...
            </div>

            <div class="postgame">

              <div class="reddit-title">
                Postgame Thread
              </div>

              <div class="reddit-postgame-thread">
                Available after final.
              </div>

            </div>

          </div>

        </div>
      `;

      card
        .querySelector(
          ".reddit-sort"
        )
        .addEventListener(
          "change",
          () => {
            refreshRedditForGame(
              gameId,
              true
            );
          }
        );

      card
        .querySelector(
          ".hide-game-button"
        )
        .addEventListener(
          "click",
          event => {

            event.stopPropagation();

            hideGame(gameId);
          }
        );

      const spoilerButton =
        card.querySelector(
          ".spoiler-toggle-button"
        );

      spoilerButton
        .addEventListener(
          "click",
          event => {

            event.stopPropagation();

            const hidden =
              card.classList.toggle(
                "spoiler-hidden"
              );

            spoilerButton.textContent =
              hidden
                ? "Show scores"
                : "Hide scores";
          }
        );

      if (
        hiddenGames.has(gameId)
      ) {

        card.classList.add(
          "hidden"
        );
      }

      scoresEl.appendChild(
        card
      );

      gameCards[gameId] =
        card;

      return card;
    }

    function getPlayTimestamp(
      play
    ) {

      const period =
        play.period?.number ||
        play.period ||
        "";

      const clock =
        play.clock?.displayValue ||
        play.displayClock ||
        play.clock ||
        "";

      if (
        period &&
        clock
      ) {
        return `Q${period} ${clock}`;
      }

      if (clock) {
        return clock;
      }

      return "Time unavailable";
    }

    async function getLatestPlays(
      gameId,
      awayAbbr,
      homeAbbr
    ) {

      try {

        const res =
          await fetch(
            `https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=${gameId}`
          );

        const data =
          await res.json();

        const latestThree =
          (data?.plays || [])
            .slice(-3)
            .reverse();

        if (
          !latestThree.length
        ) {

          return `
            <div class="play">
              No recent plays available
            </div>
          `;
        }

        return latestThree.map(
          play => {

            const hasScore =
              play.awayScore !==
                undefined &&
              play.homeScore !==
                undefined;

            const scoreText =
              hasScore
                ? `
                  <span class="score-change">
                    (${awayAbbr} ${play.awayScore}
                    - ${homeAbbr} ${play.homeScore})
                  </span>
                `
                : "";

            const timestamp =
              getPlayTimestamp(
                play
              );

            return `
              <div class="play">

                <span class="play-time">
                  ${timestamp}
                </span>

                ${escapeHTML(
                  play.text ||
                  "Play unavailable"
                )}

                ${scoreText}

              </div>
            `;
          }
        ).join("");

      } catch (err) {

        console.error(
          "Play-by-play fetch failed",
          err
        );

        return `
          <div class="play">
            Play-by-play unavailable
          </div>
        `;
      }
    }

    async function refreshRedditForGame(
      gameId,
      force = false
    ) {

      if (
        redditRefreshPaused &&
        !force
      ) {
        return;
      }

      // Placeholder Reddit refresh
      // Left intact from your baseline

      return;
    }

    function schedulePostgameChecks(
      gameId
    ) {

      const state =
        redditState[gameId];

      if (
        !state ||
        state.postgameChecksScheduled
      ) {
        return;
      }

      state.postgameChecksScheduled =
        true;

      setTimeout(async () => {

        await refreshRedditForGame(
          gameId,
          true
        );

      }, 10 * 60 * 1000);
    }

    async function loadScores() {

      try {

        const res =
          await fetch(
            "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard"
          );

        const data =
          await res.json();

        if (
          !data.events ||
          data.events.length === 0
        ) {

          scoresEl.innerHTML =
            "<p>No NBA games today.</p>";

          return;
        }

        for (
          const event of data.events
        ) {

          const comp =
            event.competitions[0];

          const teams =
            comp.competitors;

          const away =
            teams.find(
              t =>
                t.homeAway ===
                "away"
            );

          const home =
            teams.find(
              t =>
                t.homeAway ===
                "home"
            );

          const gameId =
            event.id;

          const card =
            gameCards[gameId] ||
            createGameCard(
              gameId
            );

          const gameLabel =
            `${away.team.abbreviation} vs ${home.team.abbreviation}`;

          gameLabels[gameId] =
            gameLabel;

          const awayScore =
            parseInt(
              away.score || 0
            );

          const homeScore =
            parseInt(
              home.score || 0
            );

          const prevAway =
            previousScores[
              gameId
            ]?.away ??
            awayScore;

          const prevHome =
            previousScores[
              gameId
            ]?.home ??
            homeScore;

          const awayChanged =
            awayScore !==
            prevAway;

          const homeChanged =
            homeScore !==
            prevHome;

          previousScores[
            gameId
          ] = {
            away: awayScore,
            home: homeScore
          };

          card.querySelector(
            ".away-abbr"
          ).textContent =
            away.team.abbreviation;

          card.querySelector(
            ".home-abbr"
          ).textContent =
            home.team.abbreviation;

          card.querySelector(
            ".away-name"
          ).textContent =
            away.team.displayName;

          card.querySelector(
            ".home-name"
          ).textContent =
            home.team.displayName;

          const awayScoreEl =
            card.querySelector(
              ".away-score"
            );

          const homeScoreEl =
            card.querySelector(
              ".home-score"
            );

          if (
            awayScoreEl.textContent !==
            String(awayScore)
          ) {

            awayScoreEl.textContent =
              awayScore;

            if (
              awayChanged
            ) {

              flash(
                awayScoreEl
              );
            }
          }

          if (
            homeScoreEl.textContent !==
            String(homeScore)
          ) {

            homeScoreEl.textContent =
              homeScore;

            if (
              homeChanged
            ) {

              flash(
                homeScoreEl
              );
            }
          }

          const statusEl =
            card.querySelector(
              ".status"
            );

          const state =
            event.status.type.state;

          statusEl.textContent =
            event.status.type.shortDetail;

          statusEl.className =
            "status" +
            (
              state === "in"
                ? " live"
                : ""
            );

          const broadcasts =
            comp.broadcasts &&
            comp.broadcasts.length
              ? comp.broadcasts
                  .map(
                    b =>
                      b.names
                        ? b.names.join(", ")
                        : b.name
                  )
                  .filter(
                    Boolean
                  )
                  .join(", ")
              : "TBD";

          card.querySelector(
            ".broadcast-text"
          ).textContent =
            broadcasts;

          const playsHTML =
            await getLatestPlays(
              gameId,
              away.team.abbreviation,
              home.team.abbreviation
            );

          const playsList =
            card.querySelector(
              ".plays-list"
            );

          if (
            playsList.innerHTML !==
            playsHTML
          ) {

            playsList.innerHTML =
              playsHTML;
          }

          if (
            !redditState[
              gameId
            ]
          ) {

            redditState[
              gameId
            ] = {

              awayName:
                away.team.displayName,

              homeName:
                home.team.displayName,

              awayAbbr:
                away.team.abbreviation,

              homeAbbr:
                home.team.abbreviation,

              gameThread:
                null,

              postgameThread:
                null,

              isFinal:
                false,

              postgameChecksScheduled:
                false,

              postgameStopped:
                false,

              lastRefresh:
                0
            };
          }

          redditState[
            gameId
          ].isFinal =
            state === "post";

          await refreshRedditForGame(
            gameId
          );

          if (
            state === "post"
          ) {

            schedulePostgameChecks(
              gameId
            );
          }
        }

        updateHiddenGamesUI();

        updatedEl.textContent =
          "Updated " +
          new Date()
            .toLocaleTimeString();

      } catch (err) {

        console.error(
          err
        );

        scoresEl.innerHTML =
          "<p>Failed to load scores.</p>";
      }
    }

    loadScores();

    setInterval(
      loadScores,
      1000
    );
  </script>
