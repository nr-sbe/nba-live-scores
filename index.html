<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NBA Live Scores</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --score-column-width: 150px;

      --bg: #050505;
      --panel: #0d0d0f;
      --panel-soft: #141416;
      --border: #242428;
      --text: #f5f5f5;
      --muted: #8a8a8f;
      --accent: #ff2b2b;
      --accent-soft: rgba(255, 43, 43, 0.16);
      --secondary: #22c55e;
      --gold: #f5c542;
    }

    body[data-theme="blackout"] {
      --bg: #000;
      --panel: #080808;
      --panel-soft: #111;
      --border: #202020;
      --text: #f7f7f7;
      --muted: #777;
      --accent: #ff2b2b;
      --accent-soft: rgba(255, 43, 43, 0.16);
      --secondary: #22c55e;
      --gold: #f5c542;
    }

    body[data-theme="midnight"] {
      --bg: #030712;
      --panel: #0b1020;
      --panel-soft: #111827;
      --border: #243044;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.18);
      --secondary: #22c55e;
      --gold: #facc15;
    }

    body[data-theme="purple"] {
      --bg: #090512;
      --panel: #120b22;
      --panel-soft: #1b1133;
      --border: #33204f;
      --text: #faf5ff;
      --muted: #b9a8ce;
      --accent: #a855f7;
      --accent-soft: rgba(168, 85, 247, 0.2);
      --secondary: #34d399;
      --gold: #fbbf24;
    }

    body[data-theme="forest"] {
      --bg: #020806;
      --panel: #07110d;
      --panel-soft: #0d1c16;
      --border: #1d3329;
      --text: #f0fdf4;
      --muted: #8fb3a1;
      --accent: #22c55e;
      --accent-soft: rgba(34, 197, 94, 0.18);
      --secondary: #38bdf8;
      --gold: #eab308;
    }

    body[data-theme="amber"] {
      --bg: #0a0601;
      --panel: #120d05;
      --panel-soft: #1f1608;
      --border: #3a2b12;
      --text: #fff7ed;
      --muted: #bca98d;
      --accent: #f97316;
      --accent-soft: rgba(249, 115, 22, 0.2);
      --secondary: #22c55e;
      --gold: #facc15;
    }

    body[data-theme="softblack"] {
      --bg: #010101;
      --panel: #070707;
      --panel-soft: #0c0c0c;
      --border: #181818;
      --text: #d9d9d9;
      --muted: #707070;
      --accent: #9a6cff;
      --accent-soft: rgba(154, 108, 255, 0.13);
      --secondary: #3ddc97;
      --gold: #b89d5a;
    }

    body[data-theme="lowlightgreen"] {
      --bg: #010403;
      --panel: #050b07;
      --panel-soft: #0a140d;
      --border: #17281d;
      --text: #dce8df;
      --muted: #7c9184;
      --accent: #2d5f3f;
      --accent-soft: rgba(45, 95, 63, 0.24);
      --secondary: #3f7f56;
      --gold: #b59b5a;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px;
      background:
        radial-gradient(circle at top left, var(--accent-soft), transparent 36%),
        radial-gradient(circle at top right, rgba(34,197,94,0.08), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .page {
      max-width: 1240px;
      margin: 0 auto;
    }

    .hamburger-button {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 1001;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(13, 13, 15, 0.86);
      color: var(--text);
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: 0 18px 40px rgba(0,0,0,0.45);
      backdrop-filter: blur(12px);
    }

    .hamburger-lines {
      width: 18px;
      display: grid;
      gap: 4px;
    }

    .hamburger-lines span {
      display: block;
      height: 2px;
      background: var(--text);
      border-radius: 999px;
    }

    .settings-overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(0,0,0,0.55);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .settings-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .settings-panel {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      width: min(360px, 88vw);
      height: 100vh;
      padding: 86px 22px 22px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.04), transparent 22%),
        var(--panel);
      border-right: 1px solid var(--border);
      box-shadow: 30px 0 80px rgba(0,0,0,0.5);
      transform: translateX(-100%);
      transition: transform 0.24s ease;
      overflow-y: auto;
    }

    .settings-panel.open {
      transform: translateX(0);
    }

    .settings-title {
      font-size: 24px;
      font-weight: 950;
      letter-spacing: -0.8px;
      margin-bottom: 6px;
    }

    .settings-subtitle {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 22px;
    }

    .setting-group {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(255,255,255,0.025);
      margin-bottom: 14px;
    }

    .setting-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 950;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .theme-grid {
      display: grid;
      gap: 10px;
    }

    .theme-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--panel-soft);
      color: var(--text);
      cursor: pointer;
      font-weight: 800;
      transition: 0.15s ease;
    }

    .theme-button:hover,
    .theme-button.active {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .theme-swatches {
      display: flex;
      gap: 5px;
    }

    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
    }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 24px;
      padding-left: 42px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 56px);
      font-weight: 950;
      letter-spacing: -2px;
      line-height: 0.95;
    }

    .subtitle {
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    #updated {
      color: #aaa;
      font-size: 13px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 12px;
      white-space: nowrap;
    }

    .controls {
      margin-bottom: 22px;
      padding: 16px;
      background: rgba(13,13,15,0.82);
      border: 1px solid var(--border);
      border-radius: 22px;
      display: grid;
      gap: 16px;
      box-shadow:
        0 20px 60px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.04);
      backdrop-filter: blur(14px);
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .control-row label,
    .toggle-label {
      color: #c9c9ce;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    select {
      background: #101012;
      color: white;
      border: 1px solid #33333a;
      border-radius: 10px;
      padding: 8px 10px;
      accent-color: var(--accent);
    }

    .reddit-toggle {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      color: #ddd;
      font-size: 14px;
    }

    .reddit-toggle input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .reddit-status {
      color: var(--muted);
      font-size: 12px;
    }

    #scores {
      display: grid;
      gap: 18px;
    }

    .game {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px;
      gap: 20px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.035), transparent 20%),
        var(--panel);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 24px;
      box-shadow:
        0 22px 70px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.04);
      overflow: hidden;
    }

    .game::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 28px;
      pointer-events: none;
      background: linear-gradient(90deg, var(--accent-soft), transparent 28%);
      opacity: 0.55;
    }

    .main-side,
    .reddit-side {
      position: relative;
      z-index: 1;
    }

    .card-actions {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 3;
      display: flex;
      gap: 8px;
    }

    .hide-game-button,
    .spoiler-toggle-button {
      background: #111114;
      color: #ddd;
      border: 1px solid #33333a;
      border-radius: 999px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 750;
      transition: 0.15s ease;
    }

    .hide-game-button:hover,
    .spoiler-toggle-button:hover {
      border-color: var(--accent);
      color: white;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: var(--score-column-width) 1fr;
      gap: 30px;
      align-items: center;
      padding-right: 190px;
      margin-bottom: 18px;
    }

    .scores-left {
      display: grid;
      gap: 14px;
      justify-items: start;
    }

    .score-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .score-label {
      width: 44px;
      color: #999;
      font-size: 13px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .score {
      font-size: 50px;
      line-height: 0.95;
      font-weight: 950;
      color: white;
      display: inline-block;
      transform-origin: center;
      min-width: 54px;
      font-variant-numeric: tabular-nums;
    }

    .score.flash {
      animation: flashScore 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @keyframes flashScore {
      0% {
        transform: scale(1);
        color: white;
        text-shadow: none;
      }

      20% {
        transform: scale(1.9);
        color: var(--accent);
        text-shadow:
          0 0 12px var(--accent),
          0 0 28px var(--accent),
          0 0 48px var(--accent);
      }

      60% {
        transform: scale(1.45);
        color: var(--accent);
        text-shadow:
          0 0 10px var(--accent),
          0 0 24px var(--accent);
      }

      100% {
        transform: scale(1);
        color: white;
        text-shadow: none;
      }
    }

    .teams-right {
      display: grid;
      gap: 22px;
      min-width: 0;
    }

    .team-name {
      font-size: 24px;
      font-weight: 850;
      letter-spacing: -0.5px;
    }

    .status {
      display: inline-flex;
      width: fit-content;
      margin-top: 4px;
      padding: 8px 11px;
      border: 1px solid #25252a;
      border-radius: 999px;
      color: #aaa;
      background: #101012;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .live {
      color: var(--secondary);
      border-color: rgba(34,197,94,0.35);
      background: rgba(34,197,94,0.08);
    }

    .broadcast,
    .plays {
      margin-top: 14px;
      color: #c8c8ce;
      font-size: 14px;
      line-height: 1.6;
    }

    .label {
      color: #777;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 950;
      letter-spacing: 1.1px;
      margin-right: 6px;
    }

    .plays {
      background: rgba(255,255,255,0.025);
      border: 1px solid #1f1f24;
      border-radius: 18px;
      padding: 14px;
    }

    .play {
      padding: 10px 0;
      border-bottom: 1px solid #1b1b1f;
    }

    .play:last-child {
      border-bottom: none;
    }

    .play-time {
      display: inline-block;
      color: var(--gold);
      font-weight: 950;
      margin-right: 8px;
      font-size: 12px;
    }

    .score-change {
      color: var(--secondary);
      font-weight: 900;
      margin-left: 6px;
    }

    .momentum-section {
      margin-top: 16px;
      padding: 14px;
      border-radius: 18px;
      border: 1px solid #1f1f24;
      background: rgba(255,255,255,0.025);
    }

    .momentum-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .momentum-title {
      color: #777;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 950;
      letter-spacing: 1.1px;
    }

    .momentum-run {
      color: var(--accent);
      font-size: 12px;
      font-weight: 900;
      text-align: right;
    }

    .momentum-bar {
      position: relative;
      height: 12px;
      background: #121214;
      border-radius: 999px;
      overflow: hidden;
    }

    .momentum-away,
    .momentum-home {
      position: absolute;
      top: 0;
      bottom: 0;
      transition: width 0.35s ease;
    }

    .momentum-away {
      left: 0;
      background:
        linear-gradient(
          90deg,
          rgba(255,255,255,0.12),
          transparent
        ),
        var(--accent);
    }

    .momentum-home {
      right: 0;
      background:
        linear-gradient(
          -90deg,
          rgba(255,255,255,0.12),
          transparent
        ),
        var(--secondary);
    }

    .momentum-labels {
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      color: #888;
      font-size: 11px;
      font-weight: 800;
    }

    @media (max-width: 950px) {
      body {
        padding: 20px;
      }

      .hero {
        align-items: flex-start;
        flex-direction: column;
        padding-left: 54px;
      }

      .game {
        grid-template-columns: 1fr;
      }

      .scoreboard {
        padding-right: 0;
      }

      .card-actions {
        position: static;
        margin-bottom: 14px;
      }
    }
  </style>
</head>

<body data-theme="softblack">

  <button
    class="hamburger-button"
    id="openSettings"
    type="button"
  >
    <span class="hamburger-lines">
      <span></span>
      <span></span>
      <span></span>
    </span>
  </button>

  <div
    class="settings-overlay"
    id="settingsOverlay"
  ></div>

  <aside
    class="settings-panel"
    id="settingsPanel"
  >
    <div class="settings-title">
      Settings
    </div>

    <div class="settings-subtitle">
      Customize the dashboard with different night-mode color schemes.
    </div>

    <div class="setting-group">
      <div class="setting-label">
        Night Mode Theme
      </div>

      <div class="theme-grid">

        <button class="theme-button" data-theme-option="softblack" type="button">
          Soft Black
          <span class="theme-swatches">
            <span class="swatch" style="background:#010101"></span>
            <span class="swatch" style="background:#9a6cff"></span>
            <span class="swatch" style="background:#3ddc97"></span>
          </span>
        </button>

        <button class="theme-button" data-theme-option="lowlightgreen" type="button">
          Low Light Green
          <span class="theme-swatches">
            <span class="swatch" style="background:#010403"></span>
            <span class="swatch" style="background:#2d5f3f"></span>
            <span class="swatch" style="background:#3f7f56"></span>
          </span>
        </button>

        <button class="theme-button" data-theme-option="blackout" type="button">
          Blackout
          <span class="theme-swatches">
            <span class="swatch" style="background:#000"></span>
            <span class="swatch" style="background:#ff2b2b"></span>
            <span class="swatch" style="background:#22c55e"></span>
          </span>
        </button>

        <button class="theme-button" data-theme-option="midnight" type="button">
          Midnight Blue
          <span class="theme-swatches">
            <span class="swatch" style="background:#030712"></span>
            <span class="swatch" style="background:#38bdf8"></span>
            <span class="swatch" style="background:#22c55e"></span>
          </span>
        </button>

        <button class="theme-button" data-theme-option="purple" type="button">
          Courtside Purple
          <span class="theme-swatches">
            <span class="swatch" style="background:#090512"></span>
            <span class="swatch" style="background:#a855f7"></span>
            <span class="swatch" style="background:#34d399"></span>
          </span>
        </button>

        <button class="theme-button" data-theme-option="forest" type="button">
          Forest Night
          <span class="theme-swatches">
            <span class="swatch" style="background:#020806"></span>
            <span class="swatch" style="background:#22c55e"></span>
            <span class="swatch" style="background:#38bdf8"></span>
          </span>
        </button>

        <button class="theme-button" data-theme-option="amber" type="button">
          Warm Amber
          <span class="theme-swatches">
            <span class="swatch" style="background:#0a0601"></span>
            <span class="swatch" style="background:#f97316"></span>
            <span class="swatch" style="background:#facc15"></span>
          </span>
        </button>

      </div>
    </div>
  </aside>

  <div class="page">
    <div class="hero">
      <div>
        <h1>NBA LIVE SCORES</h1>

        <div class="subtitle">
          Live scoreboard, latest plays, broadcasts, momentum, and Reddit threads.
        </div>
      </div>

      <div id="updated">
        Loading...
      </div>
    </div>

    <div class="controls">
      <div class="control-row">
        <label for="scoreSpacing">
          Score spacing
        </label>

        <input
          id="scoreSpacing"
          type="range"
          min="110"
          max="260"
          value="150"
        />
      </div>

      <div class="reddit-toggle">
        <input
          type="checkbox"
          id="pauseRedditRefresh"
        />

        <label class="toggle-label" for="pauseRedditRefresh">
          Pause Reddit Refresh
        </label>

        <span class="reddit-status" id="redditStatus">
          Reddit auto-refresh active
        </span>
      </div>
    </div>

    <div id="scores"></div>
  </div>

  <script>
    // KEEP ALL YOUR EXISTING JAVASCRIPT BELOW THIS POINT
    // No logic changes needed except the Reddit matcher update below.

    function postMatchesThreadType(postTitle, type, flairText = "") {

      const title =
        normalizeText(postTitle);

      const flair =
        normalizeText(flairText);

      const hasGameFlair =
        flair.includes("game");

      const hasPostFlair =
        flair.includes("post");

      const isPostgame =
        title.startsWith("post game thread") ||
        title.startsWith("postgame thread") ||
        title.includes("post game");

      const isGameThread =
        title.startsWith("game thread") ||
        title.includes("game thread");

      if (type === "postgame") {
        return isPostgame || hasPostFlair;
      }

      return (
        (isGameThread || hasGameFlair) &&
        !isPostgame
      );
    }

    async function findRedditThread(
      awayName,
      homeName,
      awayAbbr,
      homeAbbr,
      type
    ) {

      const queries =
        buildThreadQueries(
          awayName,
          homeName,
          awayAbbr,
          homeAbbr,
          type
        );

      let bestMatch = null;
      let bestScore = -1;

      for (const query of queries) {

        try {

          const res =
            await fetch(
              redditSearchUrl(query)
            );

          const data =
            await res.json();

          const posts =
            data?.data?.children?.map(
              x => x.data
            ) || [];

          for (const post of posts) {

            const title =
              post.title || "";

            const flair =
              post.link_flair_text || "";

            if (
              !postMatchesThreadType(
                title,
                type,
                flair
              )
            ) {
              continue;
            }

            let score = 0;

            const normalizedTitle =
              normalizeText(title);

            const awayTokens =
              getTeamTokens(
                awayName,
                awayAbbr
              );

            const homeTokens =
              getTeamTokens(
                homeName,
                homeAbbr
              );

            const awayMatch =
              awayTokens.some(token =>
                normalizedTitle.includes(token)
              );

            const homeMatch =
              homeTokens.some(token =>
                normalizedTitle.includes(token)
              );

            if (
              normalizedTitle.startsWith("game thread")
            ) {
              score += 4;
            }

            if (
              normalizedTitle.startsWith("post game thread")
            ) {
              score += 4;
            }

            if (
              flair.toLowerCase().includes("game")
            ) {
              score += 2;
            }

            if (awayMatch) {
              score += 3;
            }

            if (homeMatch) {
              score += 3;
            }

            if (
              awayMatch &&
              homeMatch
            ) {
              score += 5;
            }

            if (
              score > bestScore
            ) {

              bestScore = score;
              bestMatch = post;
            }
          }

        } catch (err) {

          console.error(
            "Reddit search failed",
            err
          );
        }
      }

      return bestMatch;
    }
  </script>
