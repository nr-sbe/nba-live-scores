<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NBA Live Scores</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --score-column-width: 150px;
      --bg: #050505;
      --panel: #0d0d0f;
      --panel-soft: #141416;
      --border: #242428;
      --text: #f5f5f5;
      --muted: #8a8a8f;
      --accent: #ff2b2b;
      --accent-soft: rgba(255, 43, 43, 0.16);
      --secondary: #22c55e;
      --gold: #f5c542;
    }

    body[data-theme="blackout"] {
      --bg: #000;
      --panel: #080808;
      --panel-soft: #111;
      --border: #202020;
      --text: #f7f7f7;
      --muted: #777;
      --accent: #ff2b2b;
      --accent-soft: rgba(255, 43, 43, 0.16);
      --secondary: #22c55e;
      --gold: #f5c542;
    }

    body[data-theme="midnight"] {
      --bg: #030712;
      --panel: #0b1020;
      --panel-soft: #111827;
      --border: #243044;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.18);
      --secondary: #22c55e;
      --gold: #facc15;
    }

    body[data-theme="purple"] {
      --bg: #090512;
      --panel: #120b22;
      --panel-soft: #1b1133;
      --border: #33204f;
      --text: #faf5ff;
      --muted: #b9a8ce;
      --accent: #a855f7;
      --accent-soft: rgba(168, 85, 247, 0.2);
      --secondary: #34d399;
      --gold: #fbbf24;
    }

    body[data-theme="forest"] {
      --bg: #020806;
      --panel: #07110d;
      --panel-soft: #0d1c16;
      --border: #1d3329;
      --text: #f0fdf4;
      --muted: #8fb3a1;
      --accent: #22c55e;
      --accent-soft: rgba(34, 197, 94, 0.18);
      --secondary: #38bdf8;
      --gold: #eab308;
    }

    body[data-theme="softblack"] {
      --bg: #010101;
      --panel: #070707;
      --panel-soft: #0c0c0c;
      --border: #181818;
      --text: #d9d9d9;
      --muted: #707070;
      --accent: #8b8b8b;
      --accent-soft: rgba(139, 139, 139, 0.14);
      --secondary: #6f7d6f;
      --gold: #a9965e;
      --momentum-away: #b68a45;
      --momentum-home: #4f9f79;
    }

    body[data-theme="lowlightgreen"] {
      --bg: #010403;
      --panel: #050b07;
      --panel-soft: #0a140d;
      --border: #17281d;
      --text: #dce8df;
      --muted: #7c9184;
      --accent: #2d5f3f;
      --accent-soft: rgba(45, 95, 63, 0.24);
      --secondary: #3f7f56;
      --gold: #b59b5a;
      --momentum-home: #1EA832;
    }

    body[data-theme="amber"] {
      --bg: #0a0601;
      --panel: #120d05;
      --panel-soft: #1f1608;
      --border: #3a2b12;
      --text: #fff7ed;
      --muted: #bca98d;
      --accent: #f97316;
      --accent-soft: rgba(249, 115, 22, 0.2);
      --secondary: #22c55e;
      --gold: #facc15;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px;
      background:
        radial-gradient(circle at top left, var(--accent-soft), transparent 36%),
        radial-gradient(circle at top right, rgba(34,197,94,0.08), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .page {
      max-width: 1240px;
      margin: 0 auto;
    }

    .hamburger-button {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 1001;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(13, 13, 15, 0.86);
      color: var(--text);
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: 0 18px 40px rgba(0,0,0,0.45);
      backdrop-filter: blur(12px);
    }

    .hamburger-lines {
      width: 18px;
      display: grid;
      gap: 4px;
    }

    .hamburger-lines span {
      display: block;
      height: 2px;
      background: var(--text);
      border-radius: 999px;
    }

    .settings-overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(0,0,0,0.55);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .settings-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .settings-panel {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      width: min(360px, 88vw);
      height: 100vh;
      padding: 86px 22px 22px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.04), transparent 22%),
        var(--panel);
      border-right: 1px solid var(--border);
      box-shadow: 30px 0 80px rgba(0,0,0,0.5);
      transform: translateX(-100%);
      transition: transform 0.24s ease;
      overflow-y: auto;
    }

    .settings-panel.open {
      transform: translateX(0);
    }

    .settings-title {
      font-size: 24px;
      font-weight: 950;
      letter-spacing: -0.8px;
      margin-bottom: 6px;
    }

    .settings-subtitle {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 22px;
    }

    .setting-group {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(255,255,255,0.025);
      margin-bottom: 14px;
    }

    .setting-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 950;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .theme-grid {
      display: grid;
      gap: 10px;
    }

    .theme-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--panel-soft);
      color: var(--text);
      cursor: pointer;
      font-weight: 800;
      transition: 0.15s ease;
    }

    .theme-button:hover,
    .theme-button.active {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .theme-swatches {
      display: flex;
      gap: 5px;
    }

    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
    }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 24px;
      padding-left: 42px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 56px);
      font-weight: 950;
      letter-spacing: -2px;
      line-height: 0.95;
    }

    .subtitle {
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    #updated {
      color: #aaa;
      font-size: 13px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 12px;
      white-space: nowrap;
    }

    .controls {
      margin-bottom: 22px;
      padding: 16px;
      background: rgba(13,13,15,0.82);
      border: 1px solid var(--border);
      border-radius: 22px;
      display: grid;
      gap: 16px;
      box-shadow:
        0 20px 60px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.04);
      backdrop-filter: blur(14px);
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .control-row label,
    .toggle-label {
      color: #c9c9ce;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    select {
      background: #101012;
      color: white;
      border: 1px solid #33333a;
      border-radius: 10px;
      padding: 8px 10px;
      accent-color: var(--accent);
    }

    .reddit-toggle {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      color: #ddd;
      font-size: 14px;
    }

    .reddit-toggle input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .reddit-status {
      color: var(--muted);
      font-size: 12px;
    }

    #hiddenGames {
      margin-bottom: 18px;
      display: none;
      padding: 14px;
      background: rgba(13,13,15,0.82);
      border: 1px solid var(--border);
      border-radius: 18px;
    }

    #hiddenGames.active {
      display: block;
    }

    .hidden-title {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      font-weight: 800;
    }

    .hidden-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      font-family: inherit;
    }

    .hidden-game-button,
    .hide-game-button,
    .spoiler-toggle-button,
    .boxscore-toggle-button {
      background: #111114;
      color: #ddd;
      border: 1px solid #33333a;
      border-radius: 999px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 750;
      transition: 0.15s ease;
    }

    .hidden-game-button:hover,
    .hide-game-button:hover,
    .spoiler-toggle-button:hover,
    .boxscore-toggle-button:hover {
      border-color: var(--accent);
      color: white;
      transform: translateY(-1px);
    }

    #scores {
      display: grid;
      gap: 18px;
    }

    .game {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px;
      gap: 20px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.035), transparent 20%),
        var(--panel);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 24px;
      box-shadow:
        0 22px 70px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.04);
      overflow: hidden;
    }

    .game::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 28px;
      pointer-events: none;
      background: linear-gradient(90deg, var(--accent-soft), transparent 28%);
      opacity: 0.55;
    }

    .game.hidden {
      display: none;
    }

    .main-side,
    .reddit-side {
      position: relative;
      z-index: 1;
    }

    .card-actions {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 3;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .game.spoiler-hidden .score {
      color: transparent !important;
      text-shadow: none !important;
      background: #1b1b1f;
      border-radius: 12px;
      min-width: 58px;
    }

    .game.spoiler-hidden .score.flash {
      animation: none !important;
    }

    .game.spoiler-hidden .score::after {
      content: "••";
      color: #6f6f76;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: var(--score-column-width) 1fr;
      gap: 30px;
      align-items: center;
      padding-right: 280px;
      margin-bottom: 18px;
    }

    .scores-left {
      display: grid;
      gap: 14px;
      justify-items: start;
    }

    .score-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .score-label {
      width: 44px;
      color: #999;
      font-size: 13px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .score {
      font-size: 50px;
      line-height: 0.95;
      font-weight: 950;
      color: white;
      display: inline-block;
      transform-origin: center;
      min-width: 54px;
      font-variant-numeric: tabular-nums;
    }

    .score.flash {
      animation: flashScore 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @keyframes flashScore {
      0% {
        transform: scale(1);
        color: white;
        text-shadow: none;
      }

      20% {
        transform: scale(1.9);
        color: var(--accent);
        text-shadow:
          0 0 12px var(--accent),
          0 0 28px var(--accent),
          0 0 48px var(--accent);
      }

      60% {
        transform: scale(1.45);
        color: var(--accent);
        text-shadow:
          0 0 10px var(--accent),
          0 0 24px var(--accent);
      }

      100% {
        transform: scale(1);
        color: white;
        text-shadow: none;
      }
    }

    .teams-right {
      display: grid;
      gap: 22px;
      min-width: 0;
    }

    .team-name {
      font-size: 24px;
      font-weight: 850;
      letter-spacing: -0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status {
      display: inline-flex;
      width: fit-content;
      margin-top: 4px;
      padding: 8px 11px;
      border: 1px solid #25252a;
      border-radius: 999px;
      color: #aaa;
      background: #101012;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .live {
      color: var(--secondary);
      border-color: rgba(34,197,94,0.35);
      background: rgba(34,197,94,0.08);
    }

    .broadcast,
    .plays,
    .reddit-panel {
      margin-top: 14px;
      color: #c8c8ce;
      font-size: 14px;
      line-height: 1.6;
    }

    .label {
      color: #777;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 950;
      letter-spacing: 1.1px;
      margin-right: 6px;
    }

    .plays {
      background: rgba(255,255,255,0.025);
      border: 1px solid #1f1f24;
      border-radius: 18px;
      padding: 14px;
    }

    .play {
      padding: 10px 0;
      border-bottom: 1px solid #1b1b1f;
    }

    .play:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .play-time {
      display: inline-block;
      color: var(--gold);
      font-weight: 950;
      margin-right: 8px;
      font-size: 12px;
    }

    .score-change {
      color: var(--secondary);
      font-weight: 900;
      margin-left: 6px;
    }

    .momentum-section,
    .boxscore-section {
      margin-top: 16px;
      padding: 14px;
      border-radius: 18px;
      border: 1px solid #1f1f24;
      background: rgba(255,255,255,0.025);
    }

    .boxscore-section.hidden {
      display: none;
    }

    .momentum-header,
    .boxscore-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .momentum-title,
    .boxscore-title {
      color: #777;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 950;
      letter-spacing: 1.1px;
    }

    .momentum-run {
      color: var(--accent);
      font-size: 12px;
      font-weight: 900;
      text-align: right;
    }

    .momentum-bar {
      position: relative;
      height: 12px;
      background: #121214;
      border-radius: 999px;
      overflow: hidden;
    }

    .momentum-away,
    .momentum-home {
      position: absolute;
      top: 0;
      bottom: 0;
      transition: width 0.35s ease;
    }

    .momentum-away {
      left: 0;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.12), transparent),
        var(--momentum-away, var(--accent));
    }

    .momentum-home {
      right: 0;
      background:
        linear-gradient(-90deg, rgba(255,255,255,0.12), transparent),
        var(--momentum-home, var(--secondary));
    }

    .momentum-labels {
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      color: #888;
      font-size: 11px;
      font-weight: 800;
    }

    .boxscore-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      color: #cfcfd4;
      font-variant-numeric: tabular-nums;
    }

    .boxscore-table th,
    .boxscore-table td {
      padding: 7px 6px;
      border-bottom: 1px solid #1b1b1f;
      text-align: right;
      white-space: nowrap;
    }

    .boxscore-table th:first-child,
    .boxscore-table td:first-child {
      text-align: left;
      color: #f0f0f0;
      font-weight: 900;
    }

    .boxscore-table th {
      color: #777;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 950;
    }

    .boxscore-note {
      margin-top: 10px;
      color: #888;
      font-size: 12px;
      line-height: 1.4;
    }

    .reddit-side {
      border-left: 1px solid #242428;
      padding-left: 20px;
      min-width: 0;
    }

    .reddit-panel {
      background: rgba(255,255,255,0.025);
      border: 1px solid #1f1f24;
      border-radius: 20px;
      padding: 16px;
      margin-top: 0;
    }

    .reddit-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .reddit-title {
      color: #fff;
      font-size: 14px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .reddit-thread-link {
      display: inline-block;
      margin: 6px 0 10px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
    }

    .reddit-thread-link:hover {
      text-decoration: underline;
    }

    .reddit-fallback {
      color: #aaa;
      font-size: 13px;
      line-height: 1.4;
      margin-top: 8px;
    }

    .comment {
      padding: 11px 0;
      border-bottom: 1px solid #1b1b1f;
    }

    .comment:last-child {
      border-bottom: none;
    }

    .comment-meta {
      color: #818188;
      font-size: 12px;
      margin-bottom: 5px;
      font-weight: 750;
    }

    .comment-body {
      color: #ddd;
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .postgame {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid #29292e;
    }

    @media (max-width: 950px) {
      body {
        padding: 20px;
      }

      .hero {
        align-items: flex-start;
        flex-direction: column;
        padding-left: 54px;
      }

      .game {
        grid-template-columns: 1fr;
      }

      .reddit-side {
        border-left: none;
        border-top: 1px solid #242428;
        padding-left: 0;
        padding-top: 18px;
      }

      .scoreboard {
        padding-right: 0;
      }

      .card-actions {
        position: static;
        margin-bottom: 14px;
        justify-content: flex-start;
      }

      .team-name {
        white-space: normal;
      }
    }
  </style>
</head>

<body data-theme="softblack">

  <button
    class="hamburger-button"
    id="openSettings"
    type="button"
    aria-label="Open settings"
  >
    <span class="hamburger-lines">
      <span></span>
      <span></span>
      <span></span>
    </span>
  </button>

  <div
    class="settings-overlay"
    id="settingsOverlay"
  ></div>

  <aside
    class="settings-panel"
    id="settingsPanel"
  >
    <div class="settings-title">
      Settings
    </div>

    <div class="settings-subtitle">
      Customize the dashboard with different night-mode color schemes.
    </div>

    <div class="setting-group">
      <div class="setting-label">
        Night Mode Theme
      </div>

      <div class="theme-grid">
        <button class="theme-button" data-theme-option="softblack" type="button">
          Soft Black
          <span class="theme-swatches">
            <span class="swatch" style="background:#010101"></span>
            <span class="swatch" style="background:#b68a45"></span>
            <span class="swatch" style="background:#4f9f79"></span>
          </span>
        </button>

        <button class="theme-button" data-theme-option="lowlightgreen" type="button">
          Low Light Green
          <span class="theme-swatches">
            <span class="swatch" style="background:#010403"></span>
            <span class="swatch" style="background:#2d5f3f"></span>
            <span class="swatch" style="background:#3f7f56"></span>
          </span>
        </button>

        <button class="theme-button" data-theme-option="blackout" type="button">
          Blackout
          <span class="theme-swatches">
            <span class="swatch" style="background:#000"></span>
            <span class="swatch" style="background:#ff2b2b"></span>
            <span class="swatch" style="background:#22c55e"></span>
          </span>
        </button>

        <button class="theme-button" data-theme-option="midnight" type="button">
          Midnight Blue
          <span class="theme-swatches">
            <span class="swatch" style="background:#030712"></span>
            <span class="swatch" style="background:#38bdf8"></span>
            <span class="swatch" style="background:#22c55e"></span>
          </span>
        </button>

        <button class="theme-button" data-theme-option="purple" type="button">
          Courtside Purple
          <span class="theme-swatches">
            <span class="swatch" style="background:#090512"></span>

    function getEasternDateParts(date = new Date()) {
      const parts =
        new Intl.DateTimeFormat(
          "en-US",
          {
            timeZone: "America/New_York",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            hourCycle: "h23"
          }
        ).formatToParts(date);

      const values = {};

      parts.forEach(part => {
        values[part.type] = part.value;
      });

      return {
        year: Number(values.year),
        month: Number(values.month),
        day: Number(values.day),
        hour: Number(values.hour)
      };
    }

    function formatDateYYYYMMDD(year, month, day) {
      return (
        String(year) +
        String(month).padStart(2, "0") +
        String(day).padStart(2, "0")
      );
    }

    function getNbaScoreboardDate() {
      const eastern =
        getEasternDateParts();

      if (eastern.hour >= 3) {
        return formatDateYYYYMMDD(
          eastern.year,
          eastern.month,
          eastern.day
        );
      }

      const previousDate =
        new Date(
          Date.UTC(
            eastern.year,
            eastern.month - 1,
            eastern.day - 1
          )
        );

      return formatDateYYYYMMDD(
        previousDate.getUTCFullYear(),
        previousDate.getUTCMonth() + 1,
        previousDate.getUTCDate()
      );
    }

    function saveHiddenGames() {
      localStorage.setItem(
        "hiddenNbaGames",
        JSON.stringify([...hiddenGames])

    function updateHiddenGamesUI() {
      hiddenGamesListEl.innerHTML = "";

      if (hiddenGames.size === 0) {
        hiddenGamesEl.classList.remove("active");
        return;
      }

      hiddenGamesEl.classList.add("active");

      [...hiddenGames].forEach(gameId => {
        const button = document.createElement("button");

        button.className = "hidden-game-button";
        button.textContent = gameLabels[gameId] || `Game ${gameId}`;

        button.addEventListener("click", () => {
          unhideGame(gameId);

      hiddenGames.add(gameId);

      if (gameCards[gameId]) {
        gameCards[gameId].classList.add("hidden");
      }

      updateHiddenGamesUI();
    }

    function unhideGame(gameId) {
      hiddenGames.delete(gameId);
      saveHiddenGames();

      if (gameCards[gameId]) {
        gameCards[gameId].classList.remove("hidden");
      }

      updateHiddenGamesUI();
    }

    function removeStaleGameCards(activeGameIds) {
      Object.keys(gameCards).forEach(gameId => {

          gameCards[gameId].remove();

          delete gameCards[gameId];
          delete previousScores[gameId];
          delete redditState[gameId];
          delete gameLabels[gameId];
          delete summaryCache[gameId];
          delete boxScoreVisible[gameId];

          hiddenGames.delete(gameId);
        }
      });

      saveHiddenGames();
      updateHiddenGamesUI();
    }

    function clearAllGameCards() {
      Object.keys(gameCards).forEach(gameId => {
        gameCards[gameId].remove();

        delete gameCards[gameId];
        delete previousScores[gameId];
        delete redditState[gameId];
        delete gameLabels[gameId];
        delete summaryCache[gameId];
        delete boxScoreVisible[gameId];

        hiddenGames.delete(gameId);

      saveHiddenGames();
      updateHiddenGamesUI();

        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")

    async function getGameSummary(gameId, force = false) {
      const now = Date.now();
      const cached = summaryCache[gameId];

      if (
        !force &&
        cached &&
        now - cached.fetchedAt < 1500
      ) {
        return cached.data;
      }

      const res =
        await fetch(
          `https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=${gameId}`
        );

      const data =
        await res.json();

      summaryCache[gameId] = {
        fetchedAt: now,
        data
      };

      return data;
    }

    function getPlayTimestamp(play) {
      const period =
        play.period?.number ||
        play.period ||
        "";

      const clock =
        play.clock?.displayValue ||
        play.displayClock ||
        play.clock ||
        "";

      if (period && clock) {
        return `Q${period} ${clock}`;
      }

      if (clock) {
        return clock;
      }

      return "Time unavailable";
    }

    async function getLatestPlays(
      gameId,
      awayAbbr,
      homeAbbr
    ) {
      try {
        const data =
          await getGameSummary(gameId);

        const latestThree =
          (data?.plays || [])
            .slice(-3)
            .reverse();

        if (!latestThree.length) {
          return `
            <div class="play">
              No recent plays available
            </div>
          `;
        }

        return latestThree.map(play => {
          const hasScore =
            play.awayScore !== undefined &&
            play.homeScore !== undefined;

          const scoreText =
            hasScore
              ? `
                <span class="score-change">
                  (${awayAbbr} ${play.awayScore}
                  - ${homeAbbr} ${play.homeScore})
                </span>
              `
              : "";

          const timestamp =
            getPlayTimestamp(play);

          return `
            <div class="play">
              <span class="play-time">
                ${timestamp}
              </span>

              ${escapeHTML(
                play.text ||
                "Play unavailable"
              )}

              ${scoreText}
            </div>
          `;
        }).join("");

      } catch (err) {
        console.error("Play-by-play fetch failed", err);

        return `
          <div class="play">
            Play-by-play unavailable
          </div>
        `;
      }
    }

    async function updateMomentum(
      gameId,
      awayTeam,
      homeTeam
    ) {
      try {
        const data =
          await getGameSummary(gameId);

        const plays =
          data?.plays || [];

        const recent =
          plays
            .filter(play =>
              play.awayScore !== undefined &&
              play.homeScore !== undefined
            )
            .slice(-12);

        let awayDelta = 0;
        let homeDelta = 0;

        for (let i = 1; i < recent.length; i++) {
          const prev =
            recent[i - 1];

          const curr =
            recent[i];

          const awayDiff =
            Number(curr.awayScore || 0) -
            Number(prev.awayScore || 0);

          const homeDiff =
            Number(curr.homeScore || 0) -
            Number(prev.homeScore || 0);

          awayDelta += Math.max(0, awayDiff);
          homeDelta += Math.max(0, homeDiff);
        }

        const card =
          gameCards[gameId];

        if (!card) return;

        const awayBar =
          card.querySelector(".momentum-away");

        const homeBar =
          card.querySelector(".momentum-home");

        const runText =
          card.querySelector(".momentum-run-text");

        const awayLabel =
          card.querySelector(".momentum-away-label");

        const homeLabel =
          card.querySelector(".momentum-home-label");

        awayLabel.textContent =
          `${awayTeam} ${awayDelta}`;

        homeLabel.textContent =
          `${homeTeam} ${homeDelta}`;

        if (recent.length < 2 || awayDelta + homeDelta === 0) {
          awayBar.style.width = "50%";
          homeBar.style.width = "50%";
          runText.textContent = "Momentum even";
          return;
        }

        const total =
          awayDelta + homeDelta;

        let awayPct =
          (awayDelta / total) * 100;

        let homePct =
          (homeDelta / total) * 100;

        awayPct =
          Math.max(8, Math.min(92, awayPct));

        homePct =
          Math.max(8, Math.min(92, homePct));

        awayBar.style.width =
          `${awayPct}%`;

        homeBar.style.width =
          `${homePct}%`;

        if (awayDelta > homeDelta) {
          runText.textContent =
            `${awayTeam} +${awayDelta - homeDelta} recent edge`;
        } else if (homeDelta > awayDelta) {
          runText.textContent =
            `${homeTeam} +${homeDelta - awayDelta} recent edge`;
        } else {
          runText.textContent =
            "Momentum even";
        }

      } catch (err) {
        console.error(
          "Momentum update failed",
          err
        );
      }
    }

    function findStatValue(stats, possibleNames) {
      if (!Array.isArray(stats)) return "—";

      const loweredNames =
        possibleNames.map(name => name.toLowerCase());

      const stat =
        stats.find(item => {
          const candidates = [
            item.name,
            item.displayName,
            item.shortDisplayName,
            item.abbreviation,
            item.label
          ]
            .filter(Boolean)
            .map(value => String(value).toLowerCase());

          return candidates.some(candidate =>
            loweredNames.some(name =>
              candidate === name ||
              candidate.includes(name)
            )
          );
        });

      return (
        stat?.displayValue ||
        stat?.value ||
        "—"
      );
    }

    function getTeamBoxStats(summaryData, awayAbbr, homeAbbr) {
      const teams =
        summaryData?.boxscore?.teams || [];

      function getForTeam(abbr) {
        const teamBox =
          teams.find(item =>
            item.team?.abbreviation === abbr
          );

        const stats =
          teamBox?.statistics || [];

        return {
          abbr,
          fg: findStatValue(stats, ["field goals", "fg"]),
          three: findStatValue(stats, ["3pt field goals", "three point", "3pt", "3p"]),
          reb: findStatValue(stats, ["rebounds", "reb"]),
          ast: findStatValue(stats, ["assists", "ast"]),
          to: findStatValue(stats, ["turnovers", "to"])
        };
      }

      return [
        getForTeam(awayAbbr),
        getForTeam(homeAbbr)
      ];
    }

    function renderMinimalBoxScore(summaryData, awayAbbr, homeAbbr) {
      const rows =
        getTeamBoxStats(
          summaryData,
          awayAbbr,
          homeAbbr
        );

      const hasSomeStats =
        rows.some(row =>
          [row.fg, row.three, row.reb, row.ast, row.to]
            .some(value => value !== "—")
        );

      if (!hasSomeStats) {
        return `
          <div class="boxscore-note">
            Minimal box score is not available yet. It usually appears once the ESPN game summary starts filling in.
          </div>
        `;
      }

      return `
        <table class="boxscore-table">
          <thead>
            <tr>
              <th>Team</th>
              <th>FG</th>
              <th>3PT</th>
              <th>REB</th>
              <th>AST</th>
              <th>TO</th>
            </tr>
          </thead>

          <tbody>
            ${rows.map(row => `
              <tr>
                <td>${escapeHTML(row.abbr)}</td>
                <td>${escapeHTML(row.fg)}</td>
                <td>${escapeHTML(row.three)}</td>
                <td>${escapeHTML(row.reb)}</td>
                <td>${escapeHTML(row.ast)}</td>
                <td>${escapeHTML(row.to)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>

        <div class="boxscore-note">
          Compact team stats only.
        </div>
      `;
    }

    async function refreshBoxScoreForGame(gameId) {
      const state =
        redditState[gameId];

      const card =
        gameCards[gameId];

      if (!state || !card) return;

      const boxscoreContent =
        card.querySelector(".boxscore-content");

      if (!boxscoreContent) return;

      try {
        const data =
          await getGameSummary(gameId, true);

        boxscoreContent.innerHTML =
          renderMinimalBoxScore(
            data,
            state.awayAbbr,
            state.homeAbbr
          );

      } catch (err) {
        console.error(
          "Box score fetch failed",
          err
        );

        boxscoreContent.innerHTML =
          "Box score unavailable.";
      }
    }

    function redditSearchUrl(query) {
      return (
        "https://www.reddit.com/r/nba/search.json" +
        `?q=${encodeURIComponent(query)}` +
        "&restrict_sr=1" +
        "&sort=new" +
        "&t=day" +
        "&limit=25" +
        "&raw_json=1"
      );
    }

    function redditSearchPageUrl(query) {
      return (
        "https://www.reddit.com/r/nba/search/" +
        `?q=${encodeURIComponent(query)}` +
        "&restrict_sr=1" +
        "&sort=new"
      );
    }

    function redditCommentsUrl(permalink, sort) {
      return (
        `https://www.reddit.com${permalink}.json` +
        `?sort=${encodeURIComponent(sort)}` +
        "&limit=8" +
        "&raw_json=1"
      );
    }

    function normalizeText(value) {
      return String(value || "")
        .toLowerCase()
        .replace(/[^a-z0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function getTeamTokens(displayName, abbr) {
      const parts =
        normalizeText(displayName)
          .split(" ")
          .filter(Boolean);

      const nickname =
        parts[parts.length - 1];

      return [
        normalizeText(displayName),
        normalizeText(abbr),
        nickname
      ].filter(Boolean);
    }

    function buildThreadQueries(
      awayName,
      homeName,
      awayAbbr,
      homeAbbr,
      type
    ) {
      const label =
        type === "postgame"
          ? "Post Game Thread"
          : "Game Thread";

      const awayNick =
        getTeamTokens(awayName, awayAbbr).slice(-1)[0];

      const homeNick =
        getTeamTokens(homeName, homeAbbr).slice(-1)[0];

      if (type === "postgame") {
        return [
          "Post Game Thread",
          `${label} ${awayName} ${homeName}`,
          `${label} ${awayAbbr} ${homeAbbr}`,
          `${label} ${awayNick} ${homeNick}`
        ];
      }

      return [
        "Game Thread",
        `${label} ${awayName} ${homeName}`,
        `${label} ${awayAbbr} ${homeAbbr}`,
        `${label} ${awayNick} ${homeNick}`,
        `${awayNick} ${homeNick} ${label}`
      ];
    }

    function scoreRedditPost(
      post,
      awayName,
      homeName,
      awayAbbr,
      homeAbbr,
      type
    ) {
      const title =
        normalizeText(post.title);

      const flair =
        normalizeText(post.link_flair_text);

      const awayTokens =
        getTeamTokens(awayName, awayAbbr);

      const homeTokens =
        getTeamTokens(homeName, homeAbbr);

      const awayMatch =
        awayTokens.some(token => title.includes(token));

      const homeMatch =
        homeTokens.some(token => title.includes(token));

      const startsGame =
        title.startsWith("game thread");

      const startsPostgame =
        title.startsWith("post game thread") ||
        title.startsWith("postgame thread");

      const hasGameThread =
        title.includes("game thread");

      const hasPostgame =
        title.includes("post game") ||
        title.includes("postgame");

      const flairGame =
        flair.includes("game");

      const flairPost =
        flair.includes("post");

      let score = 0;

      if (type === "game") {
        if (hasPostgame || flairPost) return -1;
        if (startsGame) score += 12;
        if (hasGameThread) score += 7;
        if (flairGame) score += 5;
      }

      if (type === "postgame") {
        if (startsPostgame) score += 12;
        if (hasPostgame) score += 8;
        if (flairPost) score += 5;
      }

      if (awayMatch) score += 4;
      if (homeMatch) score += 4;
      if (awayMatch && homeMatch) score += 10;

      if (!awayMatch && !homeMatch) {
        score -= 5;
      }

      if (post.created_utc) {
        const ageHours =
          (Date.now() / 1000 - post.created_utc) / 3600;

        if (ageHours <= 8) score += 4;
        else if (ageHours <= 24) score += 2;
        else score -= 4;
      }

      return score;
    }

    async function fetchRedditPosts(url) {
      try {
        const separator =
          url.includes("?")
            ? "&"
            : "?";

        const res =
          await fetch(
            `${url}${separator}cacheBust=${Date.now()}`
          );

        const data =
          await res.json();

        return data?.data?.children?.map(x => x.data) || [];

      } catch (err) {
        console.error("Reddit fetch failed", err);
        return [];
      }
    }

    async function findRedditThread(
      awayName,
      homeName,
      awayAbbr,
      homeAbbr,
      type
    ) {
      const queries =
        buildThreadQueries(
          awayName,
          homeName,
          awayAbbr,
          homeAbbr,
          type
        );

      const urls = [
        "https://www.reddit.com/r/nba/new.json?limit=100&raw_json=1",
        "https://www.reddit.com/r/nba/hot.json?limit=100&raw_json=1"
      ];

      queries.forEach(query => {
        urls.push(
          redditSearchUrl(query)
        );
      });

      let bestPost = null;
      let bestScore = -1;

      for (const url of urls) {
        const posts =
          await fetchRedditPosts(url);

        for (const post of posts) {
          const score =
            scoreRedditPost(
              post,
              awayName,
              homeName,
              awayAbbr,
              homeAbbr,
              type
            );

          if (score > bestScore) {
            bestScore = score;
            bestPost = post;
          }
        }
      }

      console.log(
        "Best Reddit match:",
        type,
        bestScore,
        bestPost?.title
      );

      return bestScore >= 8
        ? bestPost
        : null;
    }

    async function getRedditComments(permalink, sort) {
      const res =
        await fetch(
          redditCommentsUrl(
            permalink,
            sort
          )
        );

      const data =
        await res.json();

      const comments =
        data?.[1]?.data?.children
          ?.filter(
            item => item.kind === "t1"
          )
          ?.map(
            item => item.data
          )
          ?.filter(
            comment =>
              comment.body &&
              comment.body !== "[deleted]"
          )
          ?.slice(0, 6) || [];

      return comments;
    }

    function renderRedditThread(
      targetEl,
      thread,
      comments,
      fallbackText,
      fallbackSearchUrl
    ) {
      if (!thread) {
        targetEl.innerHTML = `
          <div class="reddit-fallback">
            ${escapeHTML(fallbackText)}
          </div>

          ${
            fallbackSearchUrl
              ? `
                <a
                  class="reddit-thread-link"
                  href="${fallbackSearchUrl}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  Open Reddit search
                </a>
              `
              : ""
          }
        `;

        return;
      }

      const commentsHTML =
        comments.length
          ? comments.map(comment => {
              return `
                <div class="comment">
                  <div class="comment-meta">
                    u/${escapeHTML(comment.author)}
                    • ${comment.score} upvotes
                  </div>

                  <div class="comment-body">
                    ${escapeHTML(comment.body)}
                  </div>
                </div>
              `;
            }).join("")
          : `
            <div class="comment">
              No comments found yet.
            </div>
          `;

      targetEl.innerHTML = `
        <a
          class="reddit-thread-link"
          href="https://www.reddit.com${thread.permalink}"
          target="_blank"
          rel="noopener noreferrer"
        >
          ${escapeHTML(thread.title)}
        </a>

        ${commentsHTML}
      `;
    }

    async function refreshRedditForGame(
      gameId,
      force = false
    ) {
      if (
        redditRefreshPaused &&
        !force
      ) {
        return;
      }

      const state =
        redditState[gameId];

      if (!state) return;

      const now =
        Date.now();

      if (
        !force &&
        state.lastRefresh &&
        now - state.lastRefresh < 30000
      ) {
        return;
      }

      state.lastRefresh = now;

      const card =
        gameCards[gameId];

      const sort =
        card.querySelector(
          ".reddit-sort"
        ).value;

      const gameThreadEl =
        card.querySelector(
          ".reddit-game-thread"
        );

      const postgameThreadEl =
        card.querySelector(
          ".reddit-postgame-thread"
        );

      const gameFallbackUrl =
        redditSearchPageUrl(
          `${state.awayName} ${state.homeName} Game Thread`
        );

      const postgameFallbackUrl =
        redditSearchPageUrl(
          `${state.awayName} ${state.homeName} Post Game Thread`
        );

      try {
        if (!state.gameThread) {
          state.gameThread =
            await findRedditThread(
              state.awayName,
              state.homeName,
              state.awayAbbr,
              state.homeAbbr,
              "game"
            );
        }

        if (state.gameThread) {
          const comments =
            await getRedditComments(
              state.gameThread.permalink,
              sort
            );

          renderRedditThread(
            gameThreadEl,
            state.gameThread,
            comments,
            "No game thread found yet.",
            gameFallbackUrl
          );
        } else {
          renderRedditThread(
            gameThreadEl,
            null,
            [],
            "No exact game thread found. Reddit may be blocking the lookup, or the thread title may use unusual wording.",
            gameFallbackUrl
          );
        }

        if (state.isFinal) {
          if (
            !state.postgameThread &&
            !state.postgameStopped
          ) {
            state.postgameThread =
              await findRedditThread(
                state.awayName,
                state.homeName,
                state.awayAbbr,
                state.homeAbbr,
                "postgame"
              );
          }

          if (state.postgameThread) {
            const postgameComments =
              await getRedditComments(
                state.postgameThread.permalink,
                sort
              );

            renderRedditThread(
              postgameThreadEl,
              state.postgameThread,
              postgameComments,
              "No postgame thread found yet.",
              postgameFallbackUrl
            );
          } else {
            renderRedditThread(
              postgameThreadEl,
              null,
              [],
              state.postgameStopped
                ? "No exact postgame thread found after final checks."
                : "No exact postgame thread found yet.",
              postgameFallbackUrl
            );
          }
        } else {
          postgameThreadEl.innerHTML =
            "Available after final.";
        }

      } catch (err) {
        console.error(
          "Reddit refresh failed",
          err
        );

        renderRedditThread(
          gameThreadEl,
          null,
          [],
          "Could not load Reddit directly. Use the search link instead.",
          gameFallbackUrl
        );
      }
    }

    function schedulePostgameChecks(gameId) {
      const state =
        redditState[gameId];

      if (
        !state ||
        state.postgameChecksScheduled
      ) {
        return;
      }

      state.postgameChecksScheduled =
        true;

      setTimeout(async () => {
        await refreshRedditForGame(
          gameId,
          true
        );

        if (!state.postgameThread) {
          setTimeout(async () => {
            await refreshRedditForGame(
              gameId,
              true
            );

            if (!state.postgameThread) {
              state.postgameStopped =
                true;

              await refreshRedditForGame(
                gameId,
                true
              );
            }
          }, 60 * 60 * 1000);
        }
      }, 10 * 60 * 1000);
    }

    async function loadScores() {
      currentLoadStartedAt =
        Date.now();

      try {
        const scoreboardDate =
          getNbaScoreboardDate();

        if (currentScoreboardDate !== scoreboardDate) {
          currentScoreboardDate = scoreboardDate;
          clearAllGameCards();
        }

        const res =
          await fetch(
            `https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=${scoreboardDate}`
          );

        const data =
          await res.json();

        const activeGameIds =
          new Set(
            (data.events || []).map(event => event.id)
          );

        removeStaleGameCards(activeGameIds);

        if (
          !data.events ||
          data.events.length === 0
        ) {
          scoresEl.innerHTML =
            `<p>No NBA games for ${scoreboardDate}.</p>`;

          updatedEl.textContent =
            "Updated " +
            new Date()
              .toLocaleTimeString();

          return;
        }

        if (
          scoresEl.innerHTML.includes("No NBA games")
        ) {
          scoresEl.innerHTML = "";
        }

        for (const event of data.events) {
          const comp =
            event.competitions[0];

          const teams =
            comp.competitors;

          const away =
            teams.find(
              t =>
                t.homeAway === "away"
            );

          const home =
            teams.find(
              t =>
                t.homeAway === "home"
            );

          const gameId =
            event.id;

          const card =
            gameCards[gameId] ||
            createGameCard(gameId);

          const gameLabel =
            `${away.team.abbreviation} vs ${home.team.abbreviation}`;

          gameLabels[gameId] =
            gameLabel;

          const awayScore =
            parseInt(
              away.score || 0
            );

          const homeScore =
            parseInt(
              home.score || 0
            );

          const prevAway =
            previousScores[
              gameId
            ]?.away ??
            awayScore;

          const prevHome =
            previousScores[
              gameId
            ]?.home ??
            homeScore;

          const awayChanged =
            awayScore !==
            prevAway;

          const homeChanged =
            homeScore !==
            prevHome;

          previousScores[
            gameId
          ] = {
            away: awayScore,
            home: homeScore
          };

          card.querySelector(
            ".away-abbr"
          ).textContent =
            away.team.abbreviation;

          card.querySelector(
            ".home-abbr"
          ).textContent =
            home.team.abbreviation;

          card.querySelector(
            ".away-name"
          ).textContent =
            away.team.displayName;

          card.querySelector(
            ".home-name"
          ).textContent =
            home.team.displayName;

          const awayScoreEl =
            card.querySelector(
              ".away-score"
            );

          const homeScoreEl =
            card.querySelector(
              ".home-score"
            );

          if (
            awayScoreEl.textContent !==
            String(awayScore)
          ) {
            awayScoreEl.textContent =
              awayScore;

            if (awayChanged) {
              flash(
                awayScoreEl
              );
            }
          }

          if (
            homeScoreEl.textContent !==
            String(homeScore)
          ) {
            homeScoreEl.textContent =
              homeScore;

            if (homeChanged) {
              flash(
                homeScoreEl
              );
            }
          }

          const statusEl =
            card.querySelector(
              ".status"
            );

          const state =
            event.status.type.state;

          statusEl.textContent =
            event.status.type.shortDetail;

          statusEl.className =
            "status" +
            (
              state === "in"
                ? " live"
                : ""
            );

          const broadcasts =
            comp.broadcasts &&
            comp.broadcasts.length
              ? comp.broadcasts
                  .map(
                    b =>
                      b.names
                        ? b.names.join(", ")
                        : b.name
                  )
                  .filter(
                    Boolean
                  )
                  .join(", ")
              : "TBD";

          card.querySelector(
            ".broadcast-text"
          ).textContent =
            broadcasts;

          if (!redditState[gameId]) {
            redditState[gameId] = {
              awayName:
                away.team.displayName,

              homeName:
                home.team.displayName,

              awayAbbr:
                away.team.abbreviation,

              homeAbbr:
                home.team.abbreviation,

              gameThread:
                null,

              postgameThread:
                null,

              isFinal:
                false,

              postgameChecksScheduled:
                false,

              postgameStopped:
                false,

              lastRefresh:
                0
            };
          }

          const playsHTML =
            await getLatestPlays(
              gameId,
              away.team.abbreviation,
              home.team.abbreviation
            );

          const playsList =
            card.querySelector(
              ".plays-list"
            );

          if (
            playsList.innerHTML !==
            playsHTML
          ) {
            playsList.innerHTML =
              playsHTML;
          }

          await updateMomentum(
            gameId,
            away.team.abbreviation,
            home.team.abbreviation
          );

          if (boxScoreVisible[gameId]) {
            await refreshBoxScoreForGame(gameId);
          }

          redditState[gameId].isFinal =
            state === "post";

          await refreshRedditForGame(
            gameId
          );

          if (state === "post") {
            schedulePostgameChecks(
              gameId
            );
          }
        }

        updateHiddenGamesUI();

        updatedEl.textContent =
          "Updated " +
          new Date()
            .toLocaleTimeString() +
          ` · NBA date ${scoreboardDate}`;

      } catch (err) {
        console.error(err);

        scoresEl.innerHTML =
          "<p>Failed to load scores.</p>";
      }
    }

    loadScores();

    setInterval(
      loadScores,
      1000
    );
  </script>
